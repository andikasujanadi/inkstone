[package]
name = "ink-engine"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"

[lib]
name = "inkstone"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
jni = "0.21"
wgpu = { version = "27", default-features = false, features = ["std", "vulkan", "metal", "wgsl"] }
flate2 = "1"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[features]
host-jni = []

[dev-dependencies]
naga = { version = "27", features = ["wgsl-in"] }
